{% extends "foundry/base.html" %}
{% block title %}Sign in · Lead Foundry{% endblock %}
{% block content %}
<section class="auth-card">
  <p class="eyebrow">Private workspace</p><h1>Sign in</h1>
  {% if form.errors %}<p class="error" role="alert">The username or password was not accepted.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    {% include "foundry/includes/form_fields.html" %}
    <button type="submit">Continue</button>
  </form>
</section>
{% endblock %}
