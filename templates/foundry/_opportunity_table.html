<div class="table-wrap"><table><thead><tr><th scope="col">Candidate</th><th scope="col">Signal</th><th scope="col">Status</th><th scope="col">Last communication</th></tr></thead>
<tbody>{% for item in opportunities %}<tr><td><a href="{% url 'opportunity_detail' item.id %}">{{ item.title }}</a></td><td>{{ item.reason }}</td><td><span class="status status-{{ item.status }}">{{ item.get_status_display }}</span></td><td>{{ item.last_communication_at|date:"Y-m-d H:i"|default:"Unknown" }}</td></tr>{% empty %}<tr><td colspan="4">No candidates in this view.</td></tr>{% endfor %}</tbody></table></div>
