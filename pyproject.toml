[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "midvex-lead-foundry"
version = "0.1.0"
description = "Private evidence-linked relationship intelligence and lead review"
requires-python = ">=3.14,<3.15"
dependencies = [
  "argon2-cffi>=25.1,<26",
  "bleach>=6.2,<7",
  "boto3>=1.40,<2",
  "celery>=5.6,<5.7",
  "cryptography>=50,<51",
  "django>=5.2.16,<5.3",
  "google-api-python-client>=2.180,<3",
  "google-auth-oauthlib>=1.2,<2",
  "gunicorn>=23,<24",
  "httpx>=0.28,<0.29",
  "openpyxl>=3.1,<4",
  "pgvector>=0.4,<0.5",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=6,<7",
  "pyotp>=2.9,<3",
  "python-dateutil>=2.9,<3",
  "python-docx>=1.2,<2",
  "redis>=6,<7",
  "whitenoise>=6.9,<7",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "django-stubs>=5.2,<6",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-django>=4.11,<5",
  "pytest-mock>=3.14,<4",
  "ruff>=0.12,<0.14",
]

[tool.setuptools.packages.find]
include = ["lead_foundry*", "foundry*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "lead_foundry.settings"
python_files = ["test_*.py"]
markers = [
  "integration: exercises a persistence or external boundary",
  "contract: locks an external or export interface",
  "e2e: exercises a complete user journey",
]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["foundry/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ", "S", "UP"]
ignore = ["S101", "DJ008"]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
strict = true
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "lead_foundry.settings"

[[tool.mypy.overrides]]
module = ["celery.*", "boto3.*", "google_auth_oauthlib.*", "googleapiclient.*", "lxml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "foundry.gmail"
disallow_untyped_calls = false

[tool.bandit]
exclude_dirs = ["tests", "foundry/migrations"]
